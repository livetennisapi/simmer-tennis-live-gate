name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test (stdlib only, no network — fixture-driven)
        run: python -m unittest discover -s tests -v
      - name: Demo runs clean (no network, no keys, no orders)
        run: python tennis_live_gate_skill.py
